<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">Student Management System</h1>
    <div class="card shadow p-4 mb-4">
      <h3 class="mb-3">Enter Student Details</h3>
      <form id="student-form">
        <div class="mb-3">
          <label class="form-label" for="name">Student Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Enter student name"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="mobile">Mobile Number</label>
          <input
            type="text"
            class="form-control"
            id="mobile"
            name="mobile"
            placeholder="Enter mobile number"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="address">Address</label>
          <input
            type="text"
            class="form-control"
            id="address"
            name="address"
            placeholder="Enter address"
            required
          />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary">
          Add Student
        </button>
      </form>
    </div>
    <div class="card shadow p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">All Students</h3>
        <span class="badge bg-secondary" id="student-count">
          Total Students: 0
        </span>
      </div>
      <ul id="student-list" class="list-group"></ul>
    </div>
  </div>
  <script src="./index.js"></script>
</body>
</html>
